name: Validate OurTown Site

on:
  pull_request:
    branches:
      - v5
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    name: Build and test (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Check types and style
        run: npm run check

      - name: Test
        run: npm test

      - name: Build OurTown site
        run: npx quartz build --bundleInfo -d content
